openapi: 3.0.3

info:
  title: API Producción de Leche
  version: 1.0.0
  description: API para el módulo de registro de producción de leche.

servers:
  - url: /v1/produccion-leche

tags:
  - name: Producción de Leche
    description: Endpoints para gestionar registros de producción de leche.

paths:
  /:
    get:
      tags:
        - Producción de Leche
      summary: Listar registros de producción de leche
      description: Lista todos los registros de producción con paginación.
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Registros por página.
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: vacunoId
          in: query
          required: false
          description: Filtrar por vacuno.
          schema:
            type: string
            format: uuid
        - name: fecha_registro
          in: query
          required: false
          description: Filtrar por fecha exacta.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lista de registros obtenida correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProduccionLecheResponse"

    post:
      tags:
        - Producción de Leche
      summary: Registrar producción de leche
      description: Registra un nuevo registro de producción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduccionLecheRequest"
      responses:
        "201":
          description: Registro creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProduccionLeche"
        "400":
          description: Error de validación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    - field: litros
                      message: Debe ser un número mayor a 0.
                    - field: fecha
                      message: No puede ser una fecha futura.
        "409":
          description: Registro duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: REGISTRO_DUPLICADO
                  message: Ya existe un registro para este vacuno en el mismo turno y fecha.
                  details: []

  /{id}:
    get:
      tags:
        - Producción de Leche
      summary: Obtener registro de producción
      description: Obtiene un registro específico por su UUID.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Registro encontrado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProduccionLeche"
        "404":
          description: Registro no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: PRODUCCION_LECHE_NOT_FOUND
                  message: El registro con ID 5 no existe.
                  details: []

    patch:
      tags:
        - Producción de Leche
      summary: Actualizar registro de producción
      description: Edita parcialmente un registro existente. Solo se actualizan los campos enviados.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduccionLecheRequest"
      responses:
        "200":
          description: Registro actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProduccionLeche"
        "404":
          description: Registro no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: PRODUCCION_LECHE_NOT_FOUND
                  message: El registro con ID 5 no existe.
                  details: []

    delete:
      tags:
        - Producción de Leche
      summary: Eliminar registro de producción
      description: Elimina permanentemente un registro de producción.
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204":
          description: Registro eliminado correctamente. Sin contenido.
        "404":
          description: Registro no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: PRODUCCION_LECHE_NOT_FOUND
                  message: El registro con ID 5 no existe.
                  details: []

components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: UUID del registro.
      schema:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000

  schemas:
    ProduccionLeche:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        vacunoId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        userId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        fecha_registro:
          type: string
          format: date
          example: 2024-03-15
        litros:
          type: number
          format: float
          example: 12.5
        observaciones:
          type: string
          nullable: true
          example: Producción normal
        creadoEn:
          type: string
          format: date-time
          example: 2024-03-15T08:30:00Z
        actualizadoEn:
          type: string
          format: date-time
          example: 2024-03-20T10:00:00Z
      required:
        - id
        - vacunoId
        - userId
        - fecha_registro
        - litros
        - creadoEn

    CreateProduccionLecheRequest:
      type: object
      properties:
        vacunoId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        userId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        fecha_registro:
          type: string
          format: date
          description: No puede ser fecha futura.
          example: 2024-03-15
        litros:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          example: 12.5
        turno:
          type: string
          enum:
            - manana
            - tarde
            - noche
          example: manana
        observaciones:
          type: string
          nullable: true
          maxLength: 500
          example: Primer ordeño del día
      required:
        - vacunoId
        - userId
        - fecha_registro
        - litros

    UpdateProduccionLecheRequest:
      type: object
      description: Todos los campos son opcionales.
      properties:
        vacunoId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        litros:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          example: 14.0
        turno:
          type: string
          enum:
            - manana
            - tarde
            - noche
          example: tarde
        observaciones:
          type: string
          nullable: true
          maxLength: 500
          example: Corregido por veterinario

    PaginatedProduccionLecheResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProduccionLeche"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
        totalRecords:
          type: integer
          example: 100
      required:
        - page
        - limit
        - totalPages
        - totalRecords

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Los datos enviados no son válidos.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: litros
                  message:
                    type: string
                    example: Debe ser un número mayor a 0.
      required:
        - error