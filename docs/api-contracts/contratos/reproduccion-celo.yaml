openapi: 3.0.0

info:
  title: "ZOO | Reproducción | Celo"
  description: "API para registrar, listar, editar, eliminar, consultar estado y generar reportes de celos en vacunos."
  version: "1.0.0"
  contact:
    name: "Sub-equipo Reproducción"
    email: "reproduccion@zoo.com"

servers:
  - url: "https://api.zoo.com/v1"
    description: "Producción"
  - url: "https://api-staging.zoo.com/v1"
    description: "Staging"
  - url: "http://localhost:3000/v1"
    description: "Local"

tags:
  - name: "Celos"
    description: "Operaciones relacionadas al control reproductivo de celo en vacunos"

paths:
  /vacunos/{vacunoId}/celos:
    get:
      tags:
        - "Celos"
      summary: "Listar celos del vacuno"
      description: "Retorna una lista paginada de celos registrados para un vacuno específico."
      operationId: "listCelosByVacuno"
      parameters:
        - name: vacunoId
          in: path
          required: true
          description: "ID único del vacuno"
          schema:
            type: integer
            example: 7
        - name: page
          in: query
          required: false
          description: "Número de página"
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: "Cantidad de resultados por página"
          schema:
            type: integer
            default: 20
            example: 20
        - name: estado
          in: query
          required: false
          description: "Filtrar por estado del celo"
          schema:
            type: string
            enum: [detectado, programado, fecundado, finalizado, cancelado]
            example: "detectado"
        - name: fechaInicio
          in: query
          required: false
          description: "Fecha inicial para filtrar celos"
          schema:
            type: string
            format: date
            example: "2024-03-01"
        - name: fechaFin
          in: query
          required: false
          description: "Fecha final para filtrar celos"
          schema:
            type: string
            format: date
            example: "2024-03-31"
      responses:
        '200':
          description: "Lista de celos obtenida exitosamente"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Celo'
              example:
                data:
                  - id: 1
                    vacunoId: 7
                    fechaCelo: "2024-03-12"
                    horaDeteccion: "08:30"
                    signosObservados: "Inquietud, monta a otras vacas y secreción mucosa"
                    intensidad: "alta"
                    estado: "detectado"
                    observaciones: "Se recomienda programar fecundación"
                    creadoEn: "2024-03-12T08:40:00Z"
                    actualizadoEn: "2024-03-12T08:40:00Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 10
                  totalPages: 1
        '401':
          description: "No autenticado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "Vacuno no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

    post:
      tags:
        - "Celos"
      summary: "Registrar celo"
      description: "Registra un nuevo celo para un vacuno específico."
      operationId: "createCelo"
      parameters:
        - name: vacunoId
          in: path
          required: true
          description: "ID único del vacuno"
          schema:
            type: integer
            example: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCeloRequest'
            example:
              fechaCelo: "2024-03-12"
              horaDeteccion: "08:30"
              signosObservados: "Inquietud, monta a otras vacas y secreción mucosa"
              intensidad: "alta"
              observaciones: "Se recomienda programar fecundación"
      responses:
        '201':
          description: "Celo registrado exitosamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Celo'
        '400':
          description: "Datos inválidos"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Los datos enviados no son válidos."
                  details:
                    - field: "fechaCelo"
                      message: "La fecha del celo no puede ser futura."
        '401':
          description: "No autenticado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "Vacuno no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: "Conflicto con un celo activo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "CELO_ACTIVO_EXISTS"
                  message: "El vacuno ID 7 ya tiene un celo activo."
                  details: []
        '422':
          description: "Regla de negocio inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /celos/{celoId}:
    get:
      tags:
        - "Celos"
      summary: "Obtener celo por ID"
      description: "Retorna el detalle de un registro de celo específico."
      operationId: "getCeloById"
      parameters:
        - name: celoId
          in: path
          required: true
          description: "ID único del celo"
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: "Celo obtenido exitosamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Celo'
        '401':
          description: "No autenticado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "Celo no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

    patch:
      tags:
        - "Celos"
      summary: "Editar celo"
      description: "Actualiza campos específicos de un registro de celo. Solo se envían los campos a modificar."
      operationId: "updateCelo"
      parameters:
        - name: celoId
          in: path
          required: true
          description: "ID único del celo"
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCeloRequest'
            example:
              estado: "programado"
              observaciones: "Celo programado para fecundación"
      responses:
        '200':
          description: "Celo actualizado exitosamente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Celo'
        '400':
          description: "Datos inválidos"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: "No autenticado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "Celo no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: "Regla de negocio inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

    delete:
      tags:
        - "Celos"
      summary: "Eliminar celo"
      description: "Elimina permanentemente un registro de celo. Esta acción no se puede deshacer."
      operationId: "deleteCelo"
      parameters:
        - name: celoId
          in: path
          required: true
          description: "ID único del celo a eliminar"
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: "Celo eliminado exitosamente"
        '401':
          description: "No autenticado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "Celo no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "CELO_NOT_FOUND"
                  message: "El celo con ID 1 no existe."
                  details: []
        '500':
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /vacunos/{vacunoId}/celo-estado:
    get:
      tags:
        - "Celos"
      summary: "Estado de celo del vacuno"
      description: "Retorna el estado actual de celo de un vacuno específico."
      operationId: "getCeloEstadoByVacuno"
      parameters:
        - name: vacunoId
          in: path
          required: true
          description: "ID único del vacuno"
          schema:
            type: integer
            example: 7

